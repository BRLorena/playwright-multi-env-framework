name: Playwright Multi-Environment Tests

# Branch → Environment mapping:
#   main    → stable (port 3001)
#   release → release (port 3002)
#   int     → int (port 3003)
# Pull requests test the environment of the branch they merge INTO.
# The daily schedule runs all three and refreshes the public Allure report.

on:
  push:
    branches: [main, release, int]
  pull_request:
    branches: [main, release, int]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test (stable, release, int, or all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - stable
          - release
          - int
  schedule:
    - cron: "0 6 * * *"

# Only one Pages publish at a time per ref; a new run doesn't cancel one that is publishing.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve which environment(s) to test based on the trigger
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.set-envs.outputs.envs }}
    steps:
      - name: Determine environments
        id: set-envs
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo 'envs=["stable","release","int"]' >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            if [[ "$ENV" == "all" ]]; then
              echo 'envs=["stable","release","int"]' >> "$GITHUB_OUTPUT"
            else
              echo "envs=[\"$ENV\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            # base_ref = target branch of a PR; ref_name = pushed branch
            BRANCH="${{ github.base_ref || github.ref_name }}"
            case "$BRANCH" in
              main|master) echo 'envs=["stable"]' >> "$GITHUB_OUTPUT" ;;
              release)     echo 'envs=["release"]' >> "$GITHUB_OUTPUT" ;;
              int)         echo 'envs=["int"]' >> "$GITHUB_OUTPUT" ;;
              *)           echo 'envs=["stable"]' >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  test:
    runs-on: ubuntu-latest
    needs: resolve-env
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.resolve-env.outputs.envs) }}

    name: Test ${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The ubuntu runner already ships Chrome's system libraries, so --with-deps
      # (apt-get of fonts/xvfb) isn't needed. On a cache hit there's nothing to install.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Playwright's webServer config auto-starts the server for each project.
      # In CI, reuseExistingServer is false so it always starts a fresh one,
      # and TEST_ENVS limits it to the env under test.
      - name: Run Playwright tests (${{ matrix.env }})
        id: run-tests
        run: |
          set +e
          npx playwright test --project=${{ matrix.env }} 2>&1 | tee playwright-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Parse summary line: e.g. "16 passed", "14 passed, 2 failed"
          PASSED=$(grep -oP '\d+(?= passed)' playwright-output.txt | tail -1 || echo 0)
          FAILED=$(grep -oP '\d+(?= failed)' playwright-output.txt | tail -1 || echo 0)
          SKIPPED=$(grep -oP '\d+(?= skipped)' playwright-output.txt | tail -1 || echo 0)
          TOTAL=$((${PASSED:-0} + ${FAILED:-0} + ${SKIPPED:-0}))

          echo '{"env":"${{ matrix.env }}","passed":'${PASSED:-0}',"failed":'${FAILED:-0}',"skipped":'${SKIPPED:-0}',"total":'${TOTAL}'}' > test-summary-${{ matrix.env }}.json
          cat test-summary-${{ matrix.env }}.json

          exit $EXIT_CODE
        env:
          TEST_ENVS: ${{ matrix.env }}
          STABLE_USERNAME: ${{ secrets.STABLE_USERNAME }}
          STABLE_PASSWORD: ${{ secrets.STABLE_PASSWORD }}
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          INT_USERNAME: ${{ secrets.INT_USERNAME }}
          INT_PASSWORD: ${{ secrets.INT_PASSWORD }}

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-summary-${{ matrix.env }}
          path: test-summary-${{ matrix.env }}.json
          retention-days: 7

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.env }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.env }}
          path: test-results/
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.env }}
          path: allure-results/
          retention-days: 7

  # Generate Allure report from all envs; publish to GitHub Pages only from main
  # (not from PRs or the release/int branches, which would overwrite it with one env).
  report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    name: Allure report
    permissions:
      pages: write
      id-token: write
      contents: read
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Install Allure CLI
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz | tar xz
          echo "$PWD/allure-2.30.0/bin" >> "$GITHUB_PATH"

      # The previous report's history/ folder is served by GitHub Pages; Allure needs it for trends.
      - name: Download previous Allure history
        continue-on-error: true
        run: |
          mkdir -p allure-results/history
          for f in categories-trend duration-trend history-trend history retry-trend; do
            curl -fsSL "$PAGES_URL/history/$f.json" -o "allure-results/history/$f.json" \
              && echo "Downloaded $f.json" || echo "No previous $f.json"
          done

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4

  # Merge gate — only runs on PRs targeting main (stable).
  # Add "Stable gate" as a required status check in branch protection
  # rules for main to block merges when stable tests fail.
  stable-gate:
    runs-on: ubuntu-latest
    needs: [resolve-env, test]
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    name: Stable gate
    steps:
      # Anything but success (failure, cancelled, skipped) blocks the merge.
      - name: Check stable result
        run: |
          if [[ '${{ needs.resolve-env.outputs.envs }}' != '["stable"]' ]]; then
            echo "::error::Expected stable tests for a PR into main, got ${{ needs.resolve-env.outputs.envs }}"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::Stable tests ${{ needs.test.result }} — merge blocked"
            exit 1
          fi
          echo "Stable tests passed"

  # Slack notification — runs on every workflow execution
  notify:
    runs-on: ubuntu-latest
    needs: [resolve-env, test]
    if: always()
    name: Slack notify
    steps:
      - name: Download test summaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-summary-*
          path: summaries
          merge-multiple: true

      - name: Send Slack notification
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning::SLACK_WEBHOOK_URL secret is not set — skipping notification"
            exit 0
          fi

          # Determine test status
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            STATUS_EMOJI="white_check_mark"
            STATUS_TEXT="passed"
            COLOR="good"
          else
            STATUS_EMOJI="x"
            STATUS_TEXT="failed"
            COLOR="danger"
          fi

          # Aggregate test counts from summaries
          TOTAL=0 PASSED=0 FAILED=0 SKIPPED=0
          if ls summaries/test-summary-*.json 1>/dev/null 2>&1; then
            TOTAL=$(jq -s '[.[].total] | add' summaries/test-summary-*.json)
            PASSED=$(jq -s '[.[].passed] | add' summaries/test-summary-*.json)
            FAILED=$(jq -s '[.[].failed] | add' summaries/test-summary-*.json)
            SKIPPED=$(jq -s '[.[].skipped] | add' summaries/test-summary-*.json)
          fi
          RESULTS="Total: ${TOTAL}  |  :white_check_mark: ${PASSED} passed  |  :x: ${FAILED} failed  |  :fast_forward: ${SKIPPED} skipped"

          ENVS='${{ needs.resolve-env.outputs.envs }}'
          ALLURE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Build payload using jq to guarantee valid JSON
          jq -n \
            --arg color "$COLOR" \
            --arg emoji ":${STATUS_EMOJI}:" \
            --arg status "$STATUS_TEXT" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg actor "${{ github.actor }}" \
            --arg event "${{ github.event_name }}" \
            --arg envs "$ENVS" \
            --arg results "$RESULTS" \
            --arg allure_url "$ALLURE_URL" \
            --arg workflow_url "$WORKFLOW_URL" \
            '{
              "attachments": [{
                "color": $color,
                "blocks": [
                  {
                    "type": "header",
                    "text": { "type": "plain_text", "text": "\($emoji) Playwright Tests \($status)", "emoji": true }
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Repository:*\n\($repo)" },
                      { "type": "mrkdwn", "text": "*Branch:*\n\($branch)" },
                      { "type": "mrkdwn", "text": "*Triggered by:*\n\($actor)" },
                      { "type": "mrkdwn", "text": "*Event:*\n\($event)" }
                    ]
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Environments tested:*\n\($envs)" }
                    ]
                  },
                  {
                    "type": "section",
                    "text": { "type": "mrkdwn", "text": "*Test Results:*\n\($results)" }
                  },
                  {
                    "type": "actions",
                    "elements": [
                      { "type": "button", "text": { "type": "plain_text", "text": "Allure Report", "emoji": true }, "url": $allure_url },
                      { "type": "button", "text": { "type": "plain_text", "text": "Workflow Run", "emoji": true }, "url": $workflow_url }
                    ]
                  }
                ]
              }]
            }' > slack-payload.json

          echo "::group::Slack payload"
          cat slack-payload.json
          echo "::endgroup::"

          # Send to Slack — show response body on failure for debugging
          HTTP_CODE=$(curl -s -o response.txt -w '%{http_code}' -X POST \
            -H 'Content-type: application/json' \
            --data @slack-payload.json \
            "$SLACK_WEBHOOK_URL")

          cat response.txt
          echo ""

          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "::error::Slack returned HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Slack notification sent (HTTP $HTTP_CODE)"
