name: Playwright Multi-Environment Tests

# Branch → Environment mapping:
#   main    → stable (port 3001)
#   release → release (port 3002)
#   int     → int (port 3003)
# Pull requests test the environment of the branch they merge INTO.
# The daily schedule runs all three and refreshes the public Allure report.

on:
  push:
    branches: [main, release, int]
  pull_request:
    branches: [main, release, int]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test (stable, release, int, or all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - stable
          - release
          - int
  schedule:
    - cron: "0 6 * * *"

# Only one Pages publish at a time per ref; a new run doesn't cancel one that is publishing.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve which environment(s) to test based on the trigger
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.set-envs.outputs.envs }}
    steps:
      - name: Determine environments
        id: set-envs
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo 'envs=["stable","release","int"]' >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            if [[ "$ENV" == "all" ]]; then
              echo 'envs=["stable","release","int"]' >> "$GITHUB_OUTPUT"
            else
              echo "envs=[\"$ENV\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            # base_ref = target branch of a PR; ref_name = pushed branch
            BRANCH="${{ github.base_ref || github.ref_name }}"
            case "$BRANCH" in
              main|master) echo 'envs=["stable"]' >> "$GITHUB_OUTPUT" ;;
              release)     echo 'envs=["release"]' >> "$GITHUB_OUTPUT" ;;
              int)         echo 'envs=["int"]' >> "$GITHUB_OUTPUT" ;;
              *)           echo 'envs=["stable"]' >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  # Type-check, ESLint (incl. eslint-plugin-playwright) and Prettier
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint and format check
        run: npm run check

  test:
    runs-on: ubuntu-latest
    needs: resolve-env
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.resolve-env.outputs.envs) }}

    name: Test ${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The ubuntu runner already ships Chrome's system libraries, so --with-deps
      # (apt-get of fonts/xvfb) isn't needed. On a cache hit there's nothing to install.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Playwright's webServer config auto-starts the server for each project.
      # In CI, reuseExistingServer is false so it always starts a fresh one,
      # and TEST_ENVS limits it to the env under test.
      - name: Run Playwright tests (${{ matrix.env }})
        run: npx playwright test --project=${{ matrix.env }}
        env:
          TEST_ENVS: ${{ matrix.env }}
          STABLE_USERNAME: ${{ secrets.STABLE_USERNAME }}
          STABLE_PASSWORD: ${{ secrets.STABLE_PASSWORD }}
          RELEASE_USERNAME: ${{ secrets.RELEASE_USERNAME }}
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
          INT_USERNAME: ${{ secrets.INT_USERNAME }}
          INT_PASSWORD: ${{ secrets.INT_PASSWORD }}

      # Pass/fail/flaky counts and flaky test names on the run's summary page
      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          [ -f reports/results.json ] || exit 0
          {
            echo "## ${{ matrix.env }}"
            jq -r '.stats | "| ✅ Passed | ❌ Failed | ⚠️ Flaky | ⏭️ Skipped | ⏱️ Duration |\n|---|---|---|---|---|\n| \(.expected) | \(.unexpected) | \(.flaky) | \(.skipped) | \(.duration / 1000 | floor)s |"' reports/results.json
            jq -r '[.. | objects | select(has("specs")) | .specs[] | select(any(.tests[]; .status == "flaky")) | "- ⚠️ flaky: \(.file):\(.line) › \(.title)"] | .[]' reports/results.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.env }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.env }}
          path: test-results/
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.env }}
          path: allure-results/
          retention-days: 7

  # Generate Allure report from all envs; publish to GitHub Pages only from main
  # (not from PRs or the release/int branches, which would overwrite it with one env).
  report:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    name: Allure report
    permissions:
      pages: write
      id-token: write
      contents: read
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Allure 3 keeps trend data in one history.jsonl file (see allurerc.mjs).
      # Each main deploy publishes it next to the report on GitHub Pages.
      - name: Download previous Allure history
        continue-on-error: true
        run: |
          curl -fsSL "$PAGES_URL/history.jsonl" -o history.jsonl \
            && echo "Downloaded history ($(wc -l < history.jsonl) runs)" \
            || { rm -f history.jsonl; echo "No previous history"; }

      - name: Generate Allure report
        run: |
          npx allure generate allure-results
          cp history.jsonl allure-report/

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4

  # Merge gate — only runs on PRs targeting main (stable).
  # Add "Stable gate" as a required status check in branch protection
  # rules for main to block merges when stable tests fail.
  stable-gate:
    runs-on: ubuntu-latest
    needs: [resolve-env, lint, test]
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.base_ref == 'main'
    name: Stable gate
    steps:
      # Anything but success (failure, cancelled, skipped) blocks the merge.
      - name: Check stable result
        run: |
          if [[ '${{ needs.resolve-env.outputs.envs }}' != '["stable"]' ]]; then
            echo "::error::Expected stable tests for a PR into main, got ${{ needs.resolve-env.outputs.envs }}"
            exit 1
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::Lint ${{ needs.lint.result }} — merge blocked"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::Stable tests ${{ needs.test.result }} — merge blocked"
            exit 1
          fi
          echo "Stable tests passed"
